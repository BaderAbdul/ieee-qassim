function fmtDate(x){if(!x)return '';const a=x.split('-');if(a.length!==3)return x;let d=new Date(Number(a[0]),Number(a[1])-1,Number(a[2]));return new Intl.DateTimeFormat('ar-SA',{calendar:'gregory',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d)}

function email(){let p=state.p,a=authored(),head=p.headline||a[1],eyebrow=p.eyebrow||a[0],body=p.message||a[2],pad=p.compact?'17px 23px':'26px 30px';const tx=x=>e(x).replace(/\n/g,'<br>');const btn=(name,link,color=p.accentColor)=>safeUrl(link)?'<a href="'+e(safeUrl(link))+'" style="display:inline-block;margin:5px;background:'+e(color)+';padding:13px 21px;border-radius:9px;color:white;text-decoration:none;font-size:14px;font-weight:bold">'+e(name)+'</a>':'';const section=x=>'<tr><td style="padding:'+pad+'">'+x+'</td></tr>';const panel=(title,body,color='#eef6f8')=>'<div style="background:'+color+';border-radius:14px;padding:20px 23px;text-align:right"><strong style="color:#075b88;font-size:16px">'+e(title)+'</strong><div style="line-height:2.1;color:#35546a;font-size:14px;margin-top:8px">'+body+'</div></div>';let lines=[];if(p.date)lines.push('📅 <b>التاريخ:</b> '+e(fmtDate(p.date)));if(p.start)lines.push('🕡 <b>الوقت:</b> '+e(fmtTime(p.start))+(p.end?' – '+e(fmtTime(p.end)):''));if(p.attendance==='online')lines.push('💻 <b>نوع الحضور:</b> عن بُعد');else if(p.attendance==='hybrid')lines.push('📍 <b>نوع الحضور:</b> هجين');if(p.attendance!=='online'&&p.attendance!=='none'&&p.location)lines.push('📍 <b>المكان:</b> '+e(p.location));let h='<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;background:#edf3f6;font-family:Tahoma,Arial,sans-serif;color:#163e55"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#edf3f6"><tr><td align="center" style="padding:20px 10px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:white;border-radius:18px;overflow:hidden"><tr><td style="background:'+e(p.headerColor)+';color:#fff;padding:28px;text-align:center"><div style="font-size:24px;font-weight:bold;direction:ltr;letter-spacing:1px">IEEE | Qassim University</div><div style="font-size:12px;direction:ltr;margin-top:4px">IEEE Student Branch</div></td></tr><tr><td style="text-align:center;color:#fff;padding:42px 25px;background:#128c8b;background:linear-gradient(125deg,#0873a5 0%,#168d8b 45%,#6b983d 78%,#c68e34 100%)"><div style="font-size:13px;letter-spacing:2px;font-weight:bold">'+e(eyebrow)+'</div><h1 style="font-size:34px;margin:20px 0 10px;line-height:1.35;color:white">'+e(p.event)+'</h1><div style="font-size:21px;font-weight:bold">'+e(head)+'</div></td></tr>';h+=section('<h2 style="font-size:18px;color:#163e55;margin:0 0 12px">'+e(head)+'</h2><div style="font-size:15px;line-height:2;color:#35546a">'+tx(body)+'</div>');if(p.noticeVisible&&p.notice)h+=section(panel('تنبيه مهم',tx(p.notice),'#fff5de'));if(p.details&&lines.length)h+=section(panel('تفاصيل الفعالية',lines.join('<br>')));if(p.agendaVisible&&p.agenda)h+=section('<div style="color:#075b88;font-weight:bold;font-size:16px;margin-bottom:12px">من برنامجنا:</div><div style="font-size:14px;line-height:2;color:#35546a">'+tx(p.agenda)+'</div>');if(p.speakerVisible&&p.speaker)h+=section(panel('ضيف الفعالية',tx(p.speaker)));if(p.extraVisible&&(p.extraTitle||p.extraText))h+=section(panel(p.extraTitle||'متطلبات الحضور',tx(p.extraText)+(safeUrl(p.extraUrl)?'<div style="text-align:center;margin-top:17px">'+btn(p.extraLabel,p.extraUrl,'#176e61')+'</div>':''),'#eaf5ef'));state.blocks.forEach(b=>{if(b.title||b.body)h+=section(panel(b.title||'معلومات إضافية',tx(b.body)))});let links='';if(p.timing!=='cancelled'){if(p.mapVisible&&p.attendance!=='online'&&p.attendance!=='none')links+=btn('📍 الموقع على الخريطة',p.mapUrl);if(p.joinVisible)links+=btn('💻 رابط الانضمام',p.joinUrl);if(p.registrationVisible)links+=btn('سجّل الآن',p.registrationUrl);if(p.certificateVisible)links+=btn('عرض الشهادة',p.certificateUrl);if(p.feedbackVisible)links+=btn('شاركنا تقييمك',p.feedbackUrl);if(p.customVisible)links+=btn(p.customLabel,p.customUrl)}if(links)h+=section('<div style="text-align:center">'+links+'</div>');if(p.signoff)h+=section('<div style="text-align:center;color:#176b7f;font-size:15px">'+tx(p.signoff)+'</div>');if(p.footerVisible)h+='<tr><td bgcolor="'+e(p.headerColor)+'" style="background:'+e(p.headerColor)+';color:#fff;text-align:center;padding:24px;font-size:12px;direction:ltr;font-weight:bold">IEEE Qassim University Student Branch</td></tr>';return h+'</table></td></tr></table></body></html>'}

function draw(){rendered=email();$('preview').srcdoc=rendered;$('code').value=rendered;$('preview').classList.toggle('mobile',state.mode==='mobile');$('preview').classList.toggle('hidden',state.mode==='code');$('code').style.display=state.mode==='code'?'block':'none';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));let w=[];if(!state.p.event.trim())w.push('اسم الفعالية مفقود');if(state.p.mapVisible&&state.p.attendance==='inperson'&&!safeUrl(state.p.mapUrl))w.push('تم تفعيل زر الخريطة دون رابط صالح');if(state.p.extraVisible&&state.p.extraUrl&&!safeUrl(state.p.extraUrl))w.push('رابط التسجيل الإضافي غير صالح');$('warnings').innerHTML=w.length?'<div class="notice">⚠ '+w.join(' · ')+'</div>':'';try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function notify(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function download(name,data,mime){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type:mime}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function copy(x){try{await navigator.clipboard.writeText(x);notify('تم النسخ بنجاح')}catch(e){let z=document.createElement('textarea');z.value=x;document.body.append(z);z.select();let ok=document.execCommand('copy');z.remove();notify(ok?'تم النسخ':'استخدم زر التصدير')}}
$('tabs').addEventListener('click',ev=>{let b=ev.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;renderFields()});
$('fields').addEventListener('input',ev=>{let x=ev.target;if(x.dataset.p){state.p[x.dataset.p]=x.type==='checkbox'?x.checked:x.value;draw()}else if(x.dataset.b!==undefined){let b=state.blocks[Number(x.dataset.b)];if(b){b[x.dataset.prop]=x.value;draw()}}});
$('fields').addEventListener('change',ev=>{let x=ev.target;if(x.dataset.p){state.p[x.dataset.p]=x.type==='checkbox'?x.checked:x.value;draw()}});
$('fields').addEventListener('click',ev=>{let x=ev.target.closest('button');if(!x)return;if(x.id==='addBlock'){state.blocks.push({title:'',body:''});renderFields();draw()}if(x.dataset.del!==undefined){state.blocks.splice(Number(x.dataset.del),1);renderFields();draw()}});
$('modes').addEventListener('click',ev=>{let x=ev.target.closest('[data-mode]');if(x){state.mode=x.dataset.mode;draw()}});

$('download').onclick=()=>{download('IEEE-QU-email.html',rendered,'text/html;charset=utf-8');notify('تم تصدير الإيميل')};
$('saveJson').onclick=()=>{download('IEEE-QU-settings.json',JSON.stringify(state,null,2),'application/json');notify('تم حفظ الإعدادات')};

$('copyText').onclick=()=>copy([state.p.subject||'رسالة بخصوص '+state.p.event,authored()[1],state.p.message||authored()[2],state.p.date, state.p.location].join('\n'));
$('reset').onclick=()=>{if(confirm('إعادة جميع الإعدادات إلى مثال IEEE Day؟')){state=defaults();renderFields();draw();notify('تمت إعادة الضبط')}};
$('importBtn').onclick=()=>$('filePicker').click();
$('filePicker').onchange=async ev=>{let f=ev.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!v.p||!Array.isArray(v.blocks))throw Error('invalid');state={...defaults(),...v,p:{...defaults().p,...v.p}};renderFields();draw();notify('تم استيراد الإعدادات')}catch(e){notify('تعذر قراءة الملف')}ev.target.value=''};
window.studioApi={getHtml:()=>rendered,getSubject:()=>state.p.subject||('رسالة بخصوص '+state.p.event),getSamples:()=>({event:state.p.event,name:state.p.name,dateText:fmtDate(state.p.date),start:fmtTime(state.p.start),end:fmtTime(state.p.end),location:state.p.location,speaker:state.p.speaker})};
renderFields();draw();
